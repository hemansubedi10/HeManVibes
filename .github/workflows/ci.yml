name: Continuous Integration & Quality Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  code-quality-and-build:
    name: Build & Code Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permissions
        run: chmod +x gradlew

      - name: Verify Kotlin Desktop Compilation
        run: ./gradlew :desktopApp:compileKotlinJvm --stacktrace

      - name: Assemble Desktop Distribution
        run: ./gradlew :desktopApp:createDistributable --stacktrace
