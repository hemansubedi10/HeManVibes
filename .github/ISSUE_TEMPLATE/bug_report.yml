name: 🐛 Bug Report
description: Report an issue or unexpected behavior in HeMan Vibes
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below.
  - type: dropdown
    id: platform
    attributes:
      label: Operating System / Device
      description: Select the platform where the issue occurred
      options:
        - Android
        - Windows (PC)
        - macOS
        - iOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to 'Search'
        2. Search for '...'
        3. Tap Play
        4. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Logs or Screenshots
      description: Paste any stack traces or drag-and-drop screenshots here.
