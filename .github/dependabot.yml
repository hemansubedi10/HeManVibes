version: 2
updates:
  # Maintain dependencies for Gradle (KMP, Compose, Ktor, Coil, Media3)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "hemansubedi10"
    labels:
      - "dependencies"
      - "automated-pr"
    commit-message:
      prefix: "chore(deps)"

  # Maintain dependencies for GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "hemansubedi10"
    labels:
      - "ci/cd"
      - "automated-pr"
    commit-message:
      prefix: "ci(actions)"
