name: Build & Release HeMan Vibes

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permissions
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: HeManVibes-Android-APK
          path: androidApp/build/outputs/apk/debug/*.apk

  build-windows:
    name: Build Windows App (.msi / .exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Windows MSI Package
        run: .\gradlew.bat :desktopApp:packageMsi --stacktrace

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: HeManVibes-Windows-MSI
          path: desktopApp/build/compose/binaries/main/msi/*.msi

  build-macos:
    name: Build macOS App (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permissions
        run: chmod +x gradlew

      - name: Build macOS DMG Package
        run: ./gradlew :desktopApp:packageDmg --stacktrace

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: HeManVibes-macOS-DMG
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg

  release:
    name: Create GitHub Release
    needs: [build-android, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            HeManVibes-Android-APK/*.apk
            HeManVibes-Windows-MSI/*.msi
            HeManVibes-macOS-DMG/*.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
